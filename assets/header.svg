
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 360"
     width="1100" height="360"
     role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset=".55" stop-color="#10202D"/>
    <stop offset="1" stop-color="#071B19"/>
  </linearGradient>

  <linearGradient id="title">
    <stop offset="0" stop-color="#00C8FF"/>
    <stop offset="1" stop-color="#39FF14"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0" stop-color="#00C8FF" stop-opacity=".22"/>
    <stop offset="1" stop-color="#00C8FF" stop-opacity="0"/>
  </radialGradient>

  <style>
    text {font-family:monospace}
    .eyebrow {fill:#8B949E;font-size:13px;letter-spacing:4px}
    .name {font-size:45px;font-weight:bold;fill:url(#title)}
    .subtitle {fill:#C9D6E2;font-size:16px}
    .small {fill:#8B949E;font-size:11px;letter-spacing:2px}
    .cursor {fill:#39FF14;animation:blink 1s steps(2) infinite}
    @keyframes blink {50%{opacity:0}}

    .edge {
      stroke:#00C8FF;
      stroke-width:1.3;
      stroke-dasharray:5 7;
      opacity:.5;
      animation:flow 3s linear infinite;
    }
    @keyframes flow {to{stroke-dashoffset:-48}}

    .node {
      fill:#0D1117;
      stroke:#00C8FF;
      stroke-width:2;
      animation:pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      50% {fill:#00C8FF;filter:drop-shadow(0 0 5px #00C8FF)}
    }

    .green {stroke:#39FF14;animation-name:pulseGreen}
    @keyframes pulseGreen {
      50% {fill:#39FF14;filter:drop-shadow(0 0 5px #39FF14)}
    }

    .particle {
      fill:#39FF14;
      animation:float 4s linear infinite;
    }
    @keyframes float {
      0% {transform:translate(0,0);opacity:0}
      20% {opacity:1}
      80% {opacity:1}
      100% {transform:translate(35px,-45px);opacity:0}
    }

    .stem {
      fill:none;
      stroke:#39FF14;
      stroke-width:3.5;
      stroke-linecap:round;
      stroke-dasharray:180;
      stroke-dashoffset:180;
      animation:grow 8s ease-in-out infinite;
    }
    @keyframes grow {
      0%,10% {stroke-dashoffset:180}
      45%,80% {stroke-dashoffset:0}
      100% {stroke-dashoffset:0}
    }

    .leaf {
      fill:#39FF14;
      transform-box:fill-box;
      transform-origin:center;
      animation:leafGrow 8s ease-in-out infinite;
    }
    @keyframes leafGrow {
      0%,30% {transform:scale(0)}
      50%,80% {transform:scale(1)}
      100% {transform:scale(0)}
    }

    .tag {fill:#101C27;stroke:#00C8FF;stroke-width:1}
    .tagText {fill:#00C8FF;font-size:11px;font-weight:bold}
  </style>
</defs>

<rect width="1100" height="360" rx="20" fill="url(#bg)"/>
<circle cx="800" cy="170" r="220" fill="url(#glow)"/>

<g stroke="#00C8FF" opacity=".07">
  <path d="M0 70H1100 M0 140H1100 M0 210H1100 M0 280H1100"/>
  <path d="M100 0V360 M200 0V360 M300 0V360 M400 0V360 M500 0V360"/>
</g>

<text class="eyebrow" x="55" y="75">
  ARTIFICIAL INTELLIGENCE · DATA SCIENCE
</text>

<text class="name" x="52" y="137">Khadija Mousaid</text>

<text class="subtitle" x="55" y="180">
  Engineering Student · IDSI @ FST Mohammedia
</text>

<text class="subtitle" x="55" y="217">
  &gt; Turning data into intelligence
  <tspan class="cursor">█</tspan>
</text>

<g transform="translate(55 255)">
  <rect class="tag" width="75" height="29" rx="7"/>
  <text class="tagText" x="37" y="19" text-anchor="middle">AI</text>

  <rect class="tag" x="87" width="75" height="29" rx="7"/>
  <text class="tagText" x="124" y="19" text-anchor="middle">ML</text>

  <rect class="tag" x="174" width="75" height="29" rx="7"/>
  <text class="tagText" x="211" y="19" text-anchor="middle">DL</text>

  <rect class="tag" x="261" width="90" height="29" rx="7"/>
  <text class="tagText" x="306" y="19" text-anchor="middle">DATA</text>
</g>

<text class="small" x="55" y="325">
  SENSE · THINK · BUILD · GROW
</text>

<g class="edge" fill="none">
  <path d="M570 95L650 65L730 105"/>
  <path d="M570 95L650 145L730 105"/>
  <path d="M570 165L650 65L730 185"/>
  <path d="M570 165L650 145L730 185"/>
  <path d="M570 235L650 145L730 265"/>
  <path d="M570 235L650 225L730 265"/>
  <path d="M650 65L730 105L800 165"/>
  <path d="M650 145L730 185L800 165"/>
  <path d="M650 225L730 265L800 165"/>
</g>

<g>
  <circle class="node" cx="570" cy="95" r="8"/>
  <circle class="node" cx="570" cy="165" r="8"/>
  <circle class="node" cx="570" cy="235" r="8"/>

  <circle class="node" cx="650" cy="65" r="8"/>
  <circle class="node" cx="650" cy="145" r="8"/>
  <circle class="node" cx="650" cy="225" r="8"/>

  <circle class="node green" cx="730" cy="105" r="9"/>
  <circle class="node green" cx="730" cy="185" r="9"/>
  <circle class="node green" cx="730" cy="265" r="9"/>
  <circle class="node green" cx="800" cy="165" r="11"/>
</g>

<circle class="particle" cx="570" cy="95" r="3"/>
<circle class="particle" cx="650" cy="145" r="3" style="animation-delay:1s"/>
<circle class="particle" cx="730" cy="185" r="3" style="animation-delay:2s"/>

<line x1="900" y1="300" x2="1060" y2="300"
      stroke="#263B43" stroke-width="3"/>

<path class="stem" d="M980 300C980 250 960 210 985 145"/>

<ellipse class="leaf" cx="955" cy="240" rx="24" ry="10"
         transform="rotate(-30 955 240)"/>

<ellipse class="leaf" cx="1010" cy="210" rx="25" ry="11"
         transform="rotate(30 1010 210)"
         style="animation-delay:.5s"/>

<ellipse class="leaf" cx="966" cy="175" rx="22" ry="10"
         transform="rotate(-35 966 175)"
         style="animation-delay:1s"/>

<ellipse class="leaf" cx="1000" cy="145" rx="20" ry="9"
         transform="rotate(60 1000 145)"
         style="animation-delay:1.5s"/>

</svg>
