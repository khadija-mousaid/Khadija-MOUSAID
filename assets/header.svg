<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Khadija Mousaid - a neural network growing a plant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#0a2a22"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#39FF14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .eyebrow { fill:#6e7f91; font-size:14px; letter-spacing:3px; }
      .name { font-size:46px; font-weight:700; fill:url(#title); }
      .line { fill:#c9d6e2; font-size:17px; opacity:0; animation: appear 0.6s ease forwards; }
      .l1 { animation-delay:0.4s } .l2 { animation-delay:1.2s } .l3 { animation-delay:2s }
      .cursor { fill:#39FF14; animation: blink 1s steps(2) infinite; }
      @keyframes appear { to { opacity:1 } }
      @keyframes blink { 50% { opacity:0 } }

      .edge { stroke:#00C8FF; stroke-width:1; opacity:.35; stroke-dasharray:4 7; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-22 } }
      .node { fill:#0D1117; stroke:#00C8FF; stroke-width:2; animation: pulse 2.4s ease-in-out infinite; }
      .out  { stroke:#39FF14; }
      @keyframes pulse { 0%,100% { fill:#0D1117 } 50% { fill:#00C8FF } }
      .out { animation-name: pulseG; }
      @keyframes pulseG { 0%,100% { fill:#0D1117 } 50% { fill:#39FF14 } }

      .stem { fill:none; stroke:#39FF14; stroke-width:4; stroke-linecap:round; stroke-dasharray:240; stroke-dashoffset:240; animation: grow 9s ease-in-out infinite; }
      @keyframes grow { 0%,8% { stroke-dashoffset:240; opacity:1 } 38%,86% { stroke-dashoffset:0; opacity:1 } 100% { stroke-dashoffset:0; opacity:0 } }
      .leaf { fill:#39FF14; fill-opacity:.85; transform-box:fill-box; transform-origin:0% 100%; transform:scale(0); animation: leaf 9s ease-in-out infinite; }
      .leafR { transform-origin:100% 100%; }
      .a { animation-delay:0s } .b { animation-delay:0.5s } .c { animation-delay:1s }
      @keyframes leaf { 0%,30% { transform:scale(0) } 48%,86% { transform:scale(1) } 100% { transform:scale(0) } }
      .data { fill:#00C8FF; animation: travel 3s linear infinite; }
      @keyframes travel { 0% { offset-distance:0%; opacity:0 } 10% { opacity:1 } 90% { opacity:1 } 100% { offset-distance:100%; opacity:0 } }
      .dot1 { offset-path: path('M700 170 C760 170 790 250 880 285'); }
      .dot2 { offset-path: path('M700 110 C760 110 800 250 880 285'); animation-delay:1s; }
      .dot3 { offset-path: path('M700 230 C760 230 800 270 880 285'); animation-delay:2s; }
    </style>
  </defs>

  <rect width="1000" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="880" cy="200" r="130" fill="url(#glow)"/>

  <!-- title block -->
  <text class="eyebrow" x="50" y="78">DATA SCIENCE · SOFTWARE · AI</text>
  <text class="name" x="48" y="135">Khadija Mousaid</text>
  <text class="line l1" x="50" y="180">&gt; I teach machines to see, decide...</text>
  <text class="line l2" x="50" y="210">&gt; ...and help living things grow.</text>
  <text class="line l3" x="50" y="240">&gt; engineering student @ FST Mohammedia <tspan class="cursor">█</tspan></text>

  <!-- neural network -->
  <g>
    <!-- layer 1 -> 2 -->
    <g class="edge">
      <line x1="540" y1="90"  x2="620" y2="70"/><line x1="540" y1="90"  x2="620" y2="130"/><line x1="540" y1="90"  x2="620" y2="190"/>
      <line x1="540" y1="150" x2="620" y2="70"/><line x1="540" y1="150" x2="620" y2="130"/><line x1="540" y1="150" x2="620" y2="250"/>
      <line x1="540" y1="210" x2="620" y2="130"/><line x1="540" y1="210" x2="620" y2="190"/><line x1="540" y1="210" x2="620" y2="250"/>
      <line x1="540" y1="270" x2="620" y2="190"/><line x1="540" y1="270" x2="620" y2="250"/>
      <!-- layer 2 -> 3 -->
      <line x1="620" y1="70"  x2="700" y2="110"/><line x1="620" y1="70"  x2="700" y2="170"/>
      <line x1="620" y1="130" x2="700" y2="110"/><line x1="620" y1="130" x2="700" y2="170"/><line x1="620" y1="130" x2="700" y2="230"/>
      <line x1="620" y1="190" x2="700" y2="110"/><line x1="620" y1="190" x2="700" y2="170"/><line x1="620" y1="190" x2="700" y2="230"/>
      <line x1="620" y1="250" x2="700" y2="170"/><line x1="620" y1="250" x2="700" y2="230"/>
    </g>
    <circle class="node" cx="540" cy="90"  r="8" style="animation-delay:0s"/>
    <circle class="node" cx="540" cy="150" r="8" style="animation-delay:.3s"/>
    <circle class="node" cx="540" cy="210" r="8" style="animation-delay:.6s"/>
    <circle class="node" cx="540" cy="270" r="8" style="animation-delay:.9s"/>
    <circle class="node" cx="620" cy="70"  r="8" style="animation-delay:.4s"/>
    <circle class="node" cx="620" cy="130" r="8" style="animation-delay:.7s"/>
    <circle class="node" cx="620" cy="190" r="8" style="animation-delay:1s"/>
    <circle class="node" cx="620" cy="250" r="8" style="animation-delay:1.3s"/>
    <circle class="node out" cx="700" cy="110" r="9" style="animation-delay:.8s"/>
    <circle class="node out" cx="700" cy="170" r="9" style="animation-delay:1.1s"/>
    <circle class="node out" cx="700" cy="230" r="9" style="animation-delay:1.4s"/>
  </g>

  <!-- data flowing from the network to the plant -->
  <circle class="data dot1" r="4"/>
  <circle class="data dot2" r="4"/>
  <circle class="data dot3" r="4"/>

  <!-- ground -->
  <line x1="800" y1="286" x2="960" y2="286" stroke="#2b3a47" stroke-width="3" stroke-linecap="round"/>

  <!-- plant -->
  <path class="stem" d="M880 285 C880 240 868 200 884 140"/>
  <ellipse class="leaf leafR a" cx="858" cy="232" rx="24" ry="11" transform="rotate(-25 858 232)"/>
  <ellipse class="leaf b"       cx="906" cy="200" rx="26" ry="11" transform="rotate(25 906 200)"/>
  <ellipse class="leaf leafR c" cx="862" cy="168" rx="22" ry="10" transform="rotate(-30 862 168)"/>
  <ellipse class="leaf a"       cx="900" cy="140" rx="20" ry="9"  transform="rotate(-70 900 140)"/>
</svg>
