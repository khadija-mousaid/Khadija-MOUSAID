<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Khadija Mousaid - AI, ML, DL, Data, Software, Data Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#0a2a22"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#39FF14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C8FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .eyebrow { fill:#6e7f91; font-size:14px; letter-spacing:3px; }
      .name { font-size:46px; font-weight:700; fill:url(#title); }
      .line { fill:#c9d6e2; font-size:17px; opacity:0; animation: appear .6s ease forwards; }
      .l1 { animation-delay:.4s } .l2 { animation-delay:1.2s }
      .cursor { fill:#39FF14; animation: blink 1s steps(2) infinite; }
      @keyframes appear { to { opacity:1 } }
      @keyframes blink { 50% { opacity:0 } }

      .edge { stroke:#00C8FF; stroke-width:1; fill:none; opacity:.35; stroke-dasharray:4 7; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-22 } }
      .node { fill:#0D1117; stroke:#00C8FF; stroke-width:2; animation: pulse 2.4s ease-in-out infinite; }
      .out { stroke:#39FF14; animation-name: pulseG; }
      @keyframes pulse  { 0%,100% { fill:#0D1117 } 50% { fill:#00C8FF } }
      @keyframes pulseG { 0%,100% { fill:#0D1117 } 50% { fill:#39FF14 } }
    </style>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <circle cx="790" cy="140" r="170" fill="url(#glow)"/>

  <!-- texte -->
  <text class="eyebrow" x="50" y="75">AI · ML · DL · DATA · SOFTWARE · DATA ENGINEERING</text>
  <text class="name" x="48" y="135">Khadija Mousaid</text>
  <text class="line l1" x="50" y="180">&gt; engineering student @ FST Mohammedia</text>
  <text class="line l2" x="50" y="210">&gt; turning data into decisions <tspan class="cursor">█</tspan></text>

  <!-- réseau de neurones -->
  <g class="edge">
    <path d="M650 70L740 50M650 70L740 120M650 70L740 190M650 70L740 230
             M650 140L740 50M650 140L740 120M650 140L740 190M650 140L740 230
             M650 210L740 50M650 210L740 120M650 210L740 190M650 210L740 230"/>
    <path d="M740 50L830 90M740 50L830 140M740 50L830 190
             M740 120L830 90M740 120L830 140M740 120L830 190
             M740 190L830 90M740 190L830 140M740 190L830 190
             M740 230L830 90M740 230L830 140M740 230L830 190"/>
  </g>

  <circle class="node" cx="650" cy="70"  r="8" style="animation-delay:0s"/>
  <circle class="node" cx="650" cy="140" r="8" style="animation-delay:.3s"/>
  <circle class="node" cx="650" cy="210" r="8" style="animation-delay:.6s"/>
  <circle class="node" cx="740" cy="50"  r="8" style="animation-delay:.4s"/>
  <circle class="node" cx="740" cy="120" r="8" style="animation-delay:.7s"/>
  <circle class="node" cx="740" cy="190" r="8" style="animation-delay:1s"/>
  <circle class="node" cx="740" cy="230" r="8" style="animation-delay:1.3s"/>
  <circle class="node out" cx="830" cy="90"  r="9" style="animation-delay:.8s"/>
  <circle class="node out" cx="830" cy="140" r="9" style="animation-delay:1.1s"/>
  <circle class="node out" cx="830" cy="190" r="9" style="animation-delay:1.4s"/>

  <!-- paquets de données -->
  <circle r="4" fill="#00C8FF">
    <animateMotion dur="3s" repeatCount="indefinite" path="M650 70 L740 120 L830 140"/>
  </circle>
  <circle r="4" fill="#39FF14">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M650 210 L740 190 L830 90"/>
  </circle>
</svg>
